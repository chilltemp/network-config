---
- name: Setup Headless LLM Server on Debian 13
  hosts: gpu_server
  become: yes
  vars:
    # Get a key from https://login.tailscale.com
    tailscale_auth_key: "tskey-auth-your-key-here"
    portainer_password: "YourSecurePassword123!"

  tasks:
    - name: Update apt cache and install base dependencies
      apt:
        update_cache: yes
        name:
          - curl
          - software-properties-common
          - apt-transport-https
          - ca-certificates
          - gnupg

    - name: Add Debian 13 non-free-firmware and contrib repos
      apt_repository:
        repo: "deb http://deb.debian.org trixie main contrib non-free non-free-firmware"
        state: present

    - name: Install NVIDIA Driver and Persistence Mode
      apt:
        name:
          - nvidia-driver
          - nvidia-smi
          - nvidia-persistenced
        state: present

    - name: Ensure NVIDIA Persistence Mode is active for 3080
      systemd:
        name: nvidia-persistenced
        enabled: yes
        state: started

    - name: Install Docker Engine
      shell: curl -sSL https://get.docker.com | sh

    - name: Install NVIDIA Container Toolkit
      apt:
        name: nvidia-container-toolkit
        state: present

    - name: Restart Docker to apply NVIDIA runtime
      systemd:
        name: docker
        state: restarted

    - name: Install Tailscale
      shell: curl -fsSL https://tailscale.com | sh

    - name: Authenticate Tailscale
      command: "tailscale up --authkey={{ tailscale_auth_key }}"
      ignore_errors: yes

    - name: Configure UFW Firewall (Restrict to Tailscale)
      apt:
        name: ufw
      notify:
        - allow tailscale
        - deny all else

    - name: Create Portainer Volume
      docker_volume:
        name: portainer_data

    - name: Deploy Portainer Container
      docker_container:
        name: portainer
        image: portainer/portainer-ce:latest
        restart_policy: always
        published_ports:
          - "9443:9443"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - portainer_data:/data

  handlers:
    - name: allow tailscale
      ufw:
        rule: allow
        interface: tailscale0
    - name: deny all else
      ufw:
        state: enabled
        policy: deny
        direction: incoming
