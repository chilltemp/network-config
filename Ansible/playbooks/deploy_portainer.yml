---
- name: Stack deployment is managed in Portainer
  hosts: gpu_servers
  gather_facts: false
  tasks:
    - name: Inform operator to deploy Portainer Agent stack from repository compose file
      ansible.builtin.fail:
        msg: |
          Container/stack lifecycle is intentionally not managed by Ansible.
          Deploy the Portainer Agent stack from Portainer UI/API using:
          - portainer/docker-compose.yml
