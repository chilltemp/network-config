---
- name: Control boot target mode from Debian
  hosts: gpu_servers
  become: true
  vars:
    boot_mode: windows_default
    # Allowed values:
    # - windows_default: set Windows as persistent default
    # - debian_persistent: set Debian as persistent default
    # - debian_next_boot: set Debian for next boot only
  tasks:
    - name: Validate requested boot mode
      ansible.builtin.assert:
        that:
          - boot_mode in ['windows_default', 'debian_persistent', 'debian_next_boot']
        fail_msg: "Invalid boot_mode. Use windows_default, debian_persistent, or debian_next_boot."

    - name: Load host-specific boot variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}.yml"

    - name: Validate required boot labels
      ansible.builtin.assert:
        that:
          - (lookup('ansible.builtin.vars', 'debian_boot_label', default='') | trim) != ''
          - (lookup('ansible.builtin.vars', 'windows_boot_label', default='') | trim) != ''
        fail_msg: >-
          Missing required boot labels for {{ inventory_hostname }}. Set debian_boot_label and
          windows_boot_label in host_vars.

    - name: Ensure efibootmgr is installed
      ansible.builtin.apt:
        name: efibootmgr
        state: present
        update_cache: true

    - name: Read EFI boot entries
      ansible.builtin.command: efibootmgr
      register: efibootmgr_output
      changed_when: false

    - name: Resolve Debian boot number
      ansible.builtin.set_fact:
        debian_bootnum: >-
          {{
            (
              efibootmgr_output.stdout_lines
              | map('lower')
              | select('search', debian_boot_label_value)
              | list
              | first
              | default('')
              | regex_replace('^boot([0-9a-f]{4}).*$', '\\1')
            )
          }}
      vars:
        debian_boot_label_value: "{{ lookup('ansible.builtin.vars', 'debian_boot_label', default='') | lower }}"

    - name: Resolve Windows boot number
      ansible.builtin.set_fact:
        windows_bootnum: >-
          {{
            (
              efibootmgr_output.stdout_lines
              | map('lower')
              | select('search', windows_boot_label_value)
              | list
              | first
              | default('')
              | regex_replace('^boot([0-9a-f]{4}).*$', '\\1')
            )
          }}
      vars:
        windows_boot_label_value: "{{ lookup('ansible.builtin.vars', 'windows_boot_label', default='') | lower }}"

    - name: Fail if boot entries are missing
      ansible.builtin.fail:
        msg: >-
          Could not find one or both boot entries. Check host_vars labels: debian_boot_label={{ lookup('ansible.builtin.vars', 'debian_boot_label', default='') }}, windows_boot_label={{ lookup('ansible.builtin.vars', 'windows_boot_label', default='') }}.
      when: debian_bootnum == '' or windows_bootnum == ''

    - name: Set Windows as persistent default
      ansible.builtin.command: "efibootmgr -o {{ windows_bootnum }},{{ debian_bootnum }}"
      when: boot_mode == 'windows_default'

    - name: Set Debian as persistent default
      ansible.builtin.command: "efibootmgr -o {{ debian_bootnum }},{{ windows_bootnum }}"
      when: boot_mode == 'debian_persistent'

    - name: Set Debian for next boot only
      ansible.builtin.command: "efibootmgr -n {{ debian_bootnum }}"
      when: boot_mode == 'debian_next_boot'

    - name: Show resulting EFI state
      ansible.builtin.command: efibootmgr
      changed_when: false
