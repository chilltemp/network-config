---
- name: Install apt transport prerequisites
  ansible.builtin.apt:
    update_cache: true
    name:
      - ca-certificates
      - curl
    state: present

- name: Create Docker apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Get Debian codename
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: docker_arch
  changed_when: false

- name: Get Debian version codename
  ansible.builtin.command:
    cmd: bash -c ". /etc/os-release && echo $VERSION_CODENAME"
  register: docker_codename
  changed_when: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ docker_codename.stdout }} stable"
    state: present
    filename: docker

- name: Install Docker packages
  ansible.builtin.apt:
    update_cache: true
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Ensure Docker service is enabled
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Ensure Ansible SSH user is in docker group
  ansible.builtin.user:
    name: "{{ ansible_user | default('ansible-user') }}"
    groups: docker
    append: true

- name: Ensure host data root exists and is writable for stack directory creation
  ansible.builtin.file:
    path: "{{ host_data_root_path }}"
    state: directory
    owner: "{{ host_data_root_owner }}"
    group: "{{ host_data_root_group }}"
    mode: "{{ host_data_root_mode }}"

- name: Ensure /data is owned by uid/gid 1000 for stack bind mounts
  ansible.builtin.command:
    cmd: chown -R 1000:1000 /data
