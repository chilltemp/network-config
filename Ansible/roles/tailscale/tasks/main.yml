---
- name: Ensure tailscale package repository keyring directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Add Tailscale GPG key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian trixie main

- name: Install tailscale
  ansible.builtin.apt:
    update_cache: true
    name: tailscale
    state: present

- name: Ensure tailscaled is enabled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Validate Tailscale auth key format
  ansible.builtin.assert:
    that:
      - tailscale_auth_key is match('^tskey-auth-')
    fail_msg: "tailscale_auth_key must be a Tailscale node auth key (starts with 'tskey-auth-'), not an API key."
  when:
    - tailscale_auth_key is defined
    - tailscale_auth_key | length > 0

- name: Join tailnet if auth key is provided
  ansible.builtin.command: "tailscale up --auth-key={{ tailscale_auth_key }} --ssh"
  register: tailscale_up
  no_log: true
  changed_when: "'Logged in' in tailscale_up.stdout or 'Success' in tailscale_up.stdout"
  failed_when:
    - tailscale_up.rc != 0
    - "'already in use' not in tailscale_up.stderr"
  when:
    - tailscale_auth_key is defined
    - tailscale_auth_key | length > 0
