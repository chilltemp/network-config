# Portainer Agent stack (deploy via Portainer Stack UI)
# Runtime settings are provided as environment variables in Portainer.

version: '3.8'

services:
  portainer-agent:
    image: ${PORTAINER_AGENT_IMAGE:-portainer/agent:2.27.9}
    container_name: ${PORTAINER_AGENT_CONTAINER_NAME:-portainer_agent}
    restart: unless-stopped
    ports:
      - "${PORTAINER_AGENT_PORT:-9001}:9001"
    environment:
      - AGENT_SECRET=${PORTAINER_AGENT_SECRET:?PORTAINER_AGENT_SECRET not set}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
