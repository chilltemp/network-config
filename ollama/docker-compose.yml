# Ollama stack (deploy via Portainer Stack UI)
# Runtime settings are provided as environment variables in Portainer.

version: '3.8'

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.17.7}
    container_name: ${OLLAMA_CONTAINER_NAME:-ollama_server}
    restart: unless-stopped
    ports:
      - "${OLLAMA_BIND_IP:?OLLAMA_BIND_IP not set}:${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - OLLAMA_LOG_LEVEL=${OLLAMA_LOG_LEVEL:-info}  
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-4096}
    volumes:
      - ${HOST_DATA_PATH:-/data/ollama}/storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${OLLAMA_GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
